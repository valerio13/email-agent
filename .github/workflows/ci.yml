name: ci

on:
  push:
  pull_request:

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact --verbose

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Type-checks the app and its tests, then builds it.
      - run: npm run build
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # The tests use an in-memory database and the demo providers: no .env or services needed.
      - run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci-password
      POSTGRES_DB: ci
    steps:
      - uses: actions/checkout@v4
      # Builds the image and starts the stack in demo mode. --wait returns when the health checks
      # pass, which also means the migrations ran against a real PostgreSQL.
      - run: docker compose up -d --build --wait --wait-timeout 180
      - name: The dashboard and the API answer
        run: |
          curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="root">'
          curl -fsS -X POST http://127.0.0.1:8000/api/demo/run | grep -q '"new_emails":36'
      - name: Show the logs if it failed
        if: failure()
        run: docker compose logs
