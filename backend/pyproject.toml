[project]
name = "email-agent"
version = "0.1.0"
description = "Email agent: daily prioritized summary and reply drafts with human approval"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "apscheduler>=3.10,<4",
    "langchain>=0.3",
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "langchain-openrouter>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
